name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Check formatting, lint, and types
        run: vp check

      - name: Run tests
        run: vp test run

      - name: Build package
        run: vp run build
